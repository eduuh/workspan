# Tokyo Night Day (light) — palette for the workspan tmux bar. Sourced by tmux.conf and by the
# client-light-theme hook. Used when the terminal reports a light background.
#
# Names are roles, not hues: ink = text on a coloured pill · text/text2 = normal text ·
# muted/dim = quiet text · divider = separators and idle borders · seg/ground = raised and
# sunken backgrounds · on_* = a badge drawn on the active (blue) tab.
set -g @bn_theme light
set -g @c_ink "#e1e2e7"
set -g @c_text "#3760bf"
set -g @c_text2 "#6172b0"
set -g @c_muted "#848cb5"
set -g @c_dim "#8990b3"
set -g @c_divider "#a8aecb"
set -g @c_seg "#d0d5e3"
set -g @c_ground "#d0d5e3"
set -g @c_blue "#2e7de9"
set -g @c_cyan "#007197"
set -g @c_green "#587539"
set -g @c_amber "#8c6c3e"
set -g @c_red "#f52a65"
set -g @c_purple "#9854f1"
set -g @c_on_red "#ffd9e2"
set -g @c_on_amber "#ffe9b8"
set -g @c_on_green "#dff5cf"

set -g status-style "bg=default,fg=#3760bf"
set -g window-style "fg=#848cb5,bg=#d0d5e3"
set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#007197"
