# Tokyo Night (dark) — palette for the workspan tmux bar. Sourced by tmux.conf and by the
# client-dark-theme hook. The default.
#
# Names are roles, not hues: ink = text on a coloured pill · text/text2 = normal text ·
# muted/dim = quiet text · divider = separators and idle borders · seg/ground = raised and
# sunken backgrounds · on_* = a badge drawn on the active (blue) tab.
set -g @bn_theme dark
set -g @c_ink "#1a1b26"
set -g @c_text "#c0caf5"
set -g @c_text2 "#a9b1d6"
set -g @c_muted "#737aa2"
set -g @c_dim "#565f89"
set -g @c_divider "#3b4261"
set -g @c_seg "#1f2335"
set -g @c_ground "#16161e"
set -g @c_blue "#7aa2f7"
set -g @c_cyan "#7dcfff"
set -g @c_green "#9ece6a"
set -g @c_amber "#e0af68"
set -g @c_red "#f7768e"
set -g @c_purple "#bb9af7"
set -g @c_on_red "#3b1a22"
set -g @c_on_amber "#7a5a10"
set -g @c_on_green "#1e3a14"

set -g status-style "bg=default,fg=#c0caf5"
set -g window-style "fg=#737aa2,bg=#16161e"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"
