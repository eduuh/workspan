#============================================================================
# tmux-3.8.conf — settings that require tmux ≥ 3.8
#
# Sourced conditionally from tmux.conf via a version gate, like tmux-modern.conf,
# so the main config stays loadable on the 3.7 floor.
#============================================================================

# A watched window (`prefix m`) is badged the moment its command returns to the prompt, with the
# command's real exit status: ✓ for 0, a red ✗ otherwise. Before 3.8 the only signal for a pane that
# stays alive was 12 seconds of silence, which cannot tell "finished" from "thinking" and gives a
# failed build the same tick as a clean one. The silence watch still runs underneath, for programs
# that never return to a prompt.
#
# tmux raises this event from OSC 133 `D;<status>`, which the shell has to emit (the `precmd` hook
# in the dotfiles .zshrc). Without that mark the hook never fires and nothing changes.
# `workspan tmux-done-badge --command` ignores windows that are not being watched, so an ordinary
# `ls` badges nothing.
set-hook -g pane-command-finished 'run-shell -b "$HOME/.config/bn/workspan tmux-done-badge #{hook_window} --command --status=#{hook_command_status} >/dev/null 2>&1"'
