#============================================================================
# tmux-3.8.conf — settings that require tmux ≥ 3.8
#
# Sourced conditionally from tmux.conf via a version gate, like tmux-modern.conf,
# so the main config stays loadable on the 3.7 floor.
#============================================================================

# A watched window (`prefix m`) is badged the moment its command returns to the prompt, with the
# command's real exit status: ✓ for 0, a red ✗ otherwise. Before 3.8 the only signal for a pane that
# stays alive was 12 seconds of silence, which cannot tell "finished" from "thinking" and gives a
# failed build the same tick as a clean one. The silence watch still runs underneath, for programs
# that never return to a prompt.
#
# tmux raises this event from OSC 133 `D;<status>`, which the shell has to emit (the `precmd` hook
# in the dotfiles .zshrc). Without that mark the hook never fires and nothing changes.
# `workspan tmux-done-badge --command` ignores windows that are not being watched, so an ordinary
# `ls` badges nothing.
set-hook -g pane-command-finished 'run-shell -b "$HOME/.config/bn/workspan tmux-done-badge #{hook_window} --command --status=#{hook_command_status} >/dev/null 2>&1"'

# The line under the copy-mode cursor gets a faint ground, so the cursor is findable in a wall of
# agent output without hunting for a one-cell block.
set -g copy-mode-current-line-style "bg=#{@c_seg}"

# Keep reading a pane that is still printing. Copy mode normally freezes the view at the moment you
# entered it; with refresh on, new output keeps arriving while the cursor sits at the bottom and
# pauses as soon as you scroll up or start a selection. Stock `r` refreshes once.
bind -N "Copy mode · toggle following new output" -T copy-mode-vi R send -X refresh-toggle

# Save this pane's whole history with the time each line arrived (`capture-pane -I`), next to the
# other recordings, as epoch seconds at the start of the line (0 for lines still on screen, which
# have not entered the history yet). `prefix H` saves the same text without times, and works on any tmux.
bind -N "Text tools · save this pane's history with timestamps" M-H run-shell 'umask 077 && mkdir -p "$HOME/.local/state/bn/tmux-logs" && f="$HOME/.local/state/bn/tmux-logs/tmux-history-times-#{pane_id}-$(date +%Y%m%dT%H%M%S).log" && tmux capture-pane -I -J -p -S - -E - -t "#{pane_id}" > "$f" && tmux display-message "History with timestamps saved to $f"'

# A working agent's tab shows a slow spinner. The tabs deliberately badge only what needs you, so
# a busy window used to look identical to an idle one; this says "running" without asking for
# anything. tmux redraws the status line itself while an `A` frame list is on screen.
setw -ga window-status-format "#{?#{==:#{@bn_agent},working},#[fg=#{@c_blue}]#{A/2:⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏} ,}"
setw -ga window-status-current-format "#{?#{==:#{@bn_agent},working},#[fg=#{@c_blue}]#{A/2:⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏} ,}"
